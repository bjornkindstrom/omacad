name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests (modelling, undo, files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 numpy manifold3d trimesh PyOpenGL Pillow shapely python-solvespace pytest
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  build:
    name: Build Omacad.exe (Windows Standalone)
    needs: test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 numpy manifold3d trimesh PyOpenGL Pillow shapely python-solvespace pyinstaller

      - name: Build Standalone EXE with PyInstaller
        run: |
          pyinstaller --clean omacad.spec

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omacad-Windows-x64
          path: dist/Omacad.exe
          if-no-files-found: error

      - name: Read version
        id: ver
        shell: bash
        run: |
          v=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('omacad/__init__.py').read()).group(1))")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          cp dist/Omacad.exe "dist/Omacad-$v.exe"

      - name: Release versioned build
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: "Omacad ${{ steps.ver.outputs.version }}"
          body_path: CHANGELOG.md
          files: dist/Omacad-${{ steps.ver.outputs.version }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Omacad.exe (latest)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Omacad Windows Release"
          body: "Fristående kompakt Windows-applikation för Omacad (.exe)."
          files: dist/Omacad.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
