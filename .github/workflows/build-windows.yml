name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Omacad.exe (Windows Standalone)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 numpy manifold3d trimesh PyOpenGL Pillow shapely pyinstaller

      - name: Build Standalone EXE with PyInstaller
        run: |
          pyinstaller --clean omacad.spec

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omacad-Windows-x64
          path: dist/Omacad.exe
          if-no-files-found: error

      - name: Release Omacad.exe
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Omacad Windows Release"
          body: "Fristående kompakt Windows-applikation för Omacad (.exe)."
          files: dist/Omacad.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
